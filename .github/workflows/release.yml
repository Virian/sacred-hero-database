name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      source_tag:
        description: Existing version tag to build and release, for example v1.2.3
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.workflow }}-${{ inputs.source_tag || github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Build and publish ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-latest
            target: x86_64-pc-windows-msvc
            bundle: msi

    steps:
      - name: Checkout source
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.source_tag && format('refs/tags/{0}', inputs.source_tag) || github.ref }}

      - name: Set up pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate updater signing key
        shell: pwsh
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:TAURI_SIGNING_PRIVATE_KEY)) {
            throw 'The TAURI_SIGNING_PRIVATE_KEY repository secret is required to generate updater signatures.'
          }

      - name: Set app version
        id: version
        shell: pwsh
        env:
          SOURCE_TAG: ${{ inputs.source_tag || github.ref_name }}
        run: |
          $tag = $env:SOURCE_TAG
          $versionPattern = '^v(?<version>(?:0|[1-9]\d*)\.(?:0|[1-9]\d*)\.(?:0|[1-9]\d*)(?:-[0-9A-Za-z-]+(?:\.[0-9A-Za-z-]+)*)?(?:\+[0-9A-Za-z-]+(?:\.[0-9A-Za-z-]+)*)?)$'

          if ($tag -notmatch $versionPattern) {
            throw "Release tag '$tag' must be a semantic version such as v1.2.3."
          }
          $version = $Matches.version

          "version=$version" >> $env:GITHUB_OUTPUT

      - name: Build and publish draft release
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ inputs.source_tag || github.ref_name }}
          releaseName: ${{ inputs.source_tag || github.ref_name }}
          releaseDraft: true
          uploadUpdaterJson: true
          uploadUpdaterSignatures: true
          args: >-
            --target ${{ matrix.target }}
            --bundles ${{ matrix.bundle }}
            --config '{"version":"${{ steps.version.outputs.version }}"}'
